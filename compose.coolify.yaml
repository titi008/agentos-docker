services:
  agentos-db:
    image: agnohq/pgvector:18
    container_name: agentos-db
    restart: unless-stopped
    volumes:
      - pgdata:/var/lib/postgresql
    environment:
      POSTGRES_USER: ${DB_USER:-ai}
      POSTGRES_PASSWORD: ${DB_PASS:-ai}
      POSTGRES_DB: ${DB_DATABASE:-ai}
    networks:
      - agentos
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-ai} -d ${DB_DATABASE:-ai}"]
      interval: 5s
      timeout: 5s
      retries: 5

  agentos-api:
    build:
      context: .
      dockerfile: Dockerfile
      target: agentos
    container_name: agentos-api
    image: ${IMAGE_NAME:-agentos}:${IMAGE_TAG:-latest}
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    restart: unless-stopped
    ports:
      - "8000"
    environment:
      RUNTIME_ENV: ${RUNTIME_ENV:-prd}
      MODEL_PROVIDER: ${MODEL_PROVIDER:-gemini}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-5-5}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-6.1-sol}
      AGNO_DEBUG: "False"
      WAIT_FOR_DB: "True"
      AGENTOS_URL: ${AGENTOS_URL}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      CORS_ORIGIN_REGEX: ${CORS_ORIGIN_REGEX:-}
      OS_SECURITY_KEY: ${OS_SECURITY_KEY:-}
      JWT_VERIFICATION_KEY: ${JWT_VERIFICATION_KEY:-}
      MCP_CONNECT_SECRET: ${MCP_CONNECT_SECRET:-}
      DB_HOST: agentos-db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-ai}
      DB_PASS: ${DB_PASS:-ai}
      DB_DATABASE: ${DB_DATABASE:-ai}
    depends_on:
      agentos-db:
        condition: service_healthy
    networks:
      - agentos
    labels:
      - "coolify.managed=true"

  agentos-ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
    container_name: agentos-ui
    restart: unless-stopped
    ports:
      - "3000"
    environment:
      PORT: 3000
      NEXT_PUBLIC_API_URL: ${AGENTOS_URL:-}
      # Cloudflare Access sign-in (ui/README.md). Leave all empty to enter a token in Settings.
      CF_ACCESS_TEAM_DOMAIN: ${CF_ACCESS_TEAM_DOMAIN:-}
      CF_ACCESS_AUD: ${CF_ACCESS_AUD:-}
      AGENTOS_TOKEN_SIGNING_KEY: ${AGENTOS_TOKEN_SIGNING_KEY:-}
      AGENTOS_ADMIN_EMAILS: ${AGENTOS_ADMIN_EMAILS:-}
      AGENTOS_USER_IDS: ${AGENTOS_USER_IDS:-}
      AGENTOS_MEMBER_SCOPES: ${AGENTOS_MEMBER_SCOPES:-}
    depends_on:
      - agentos-api
    networks:
      - agentos
    labels:
      - "coolify.managed=true"

networks:
  agentos:

volumes:
  pgdata:
